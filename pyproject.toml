[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "context-compiler-example-integrations"
version = "0.1.0"
description = "Example integrations and enforcement-point demonstrations for Context Compiler."
readme = "python/README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Robert Lippmann" }]
dependencies = [
  "context-compiler>=0.8.0",
]
keywords = [
  "context-compiler",
  "examples",
  "integrations",
  "llm",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/rlippmann/context-compiler-example-integrations"
Repository = "https://github.com/rlippmann/context-compiler-example-integrations"
Issues = "https://github.com/rlippmann/context-compiler-example-integrations/issues"

[project.optional-dependencies]
all = [
  "chromadb",
  "context-compiler-directive-drafter",
  "fastapi",
  "litellm",
]
drafter = [
  "context-compiler-directive-drafter",
]
fastapi = [
  "fastapi",
]
litellm = [
  "litellm",
]
retrieval = [
  "chromadb",
]

[dependency-groups]
dev = [
  "httpx2>=2.5.0",
  "mypy",
  "pre-commit",
  "pytest",
  "ruff",
]
proxy_runtime = [
  "litellm[proxy]",
]

[tool.hatch.build.targets.wheel]
only-include = ["python", "LICENSE"]
exclude = [
  "python/tests",
  "python/**/__pycache__",
  "python/**/*.pyc",
  "python/**/.DS_Store",
]

[tool.hatch.build.targets.wheel.sources]
"python" = "context_compiler_example_integrations"

[tool.hatch.build.targets.sdist]
only-include = ["python", "LICENSE", "pyproject.toml"]
exclude = [
  "python/tests",
  "python/**/__pycache__",
  "python/**/*.pyc",
  "python/**/.DS_Store",
]


[tool.ruff]
extend-exclude = [
  ".next",
  "node_modules",
]

[tool.mypy]
files = [
  "python/examples",
  "python/reference_integrations",
]
exclude = '(^|/)(\\.venv|__pycache__|node_modules|\\.next)/'
disable_error_code = ["no-redef"]
explicit_package_bases = true
ignore_missing_imports = true
pretty = true
show_error_codes = true
