name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.classify.outputs.python }}
      markdown: ${{ steps.classify.outputs.markdown }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "${BASE_SHA:-}" =~ ^0+$ ]]; then
            changed_files="$(git show --format= --name-only "${HEAD_SHA}")"
          else
            changed_files="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          fi

          run_python=false
          run_markdown=false
          run_all=false

          while IFS= read -r path; do
            [[ -z "${path}" ]] && continue
            case "${path}" in
              .github/workflows/*|.github/actions/*|.pre-commit-config.yaml)
                run_all=true
                ;;
              .markdownlint-cli2.jsonc|*.md)
                run_markdown=true
                ;;
              python/*|context_compiler_example_integrations/*|pyproject.toml|uv.lock|.pre-commit-config.yaml)
                run_python=true
                ;;
              *)
                run_all=true
                ;;
            esac
          done <<< "${changed_files}"

          if [[ "${run_all}" == true ]]; then
            run_python=true
            run_markdown=true
          fi

          {
            echo "python=${run_python}"
            echo "markdown=${run_markdown}"
          } >> "${GITHUB_OUTPUT}"

  markdownlint:
    needs: changes
    if: needs.changes.outputs.markdown == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Run Markdown lint
        run: npx --yes markdownlint-cli2

  python-quality:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Sync Python dependencies
        run: uv sync --locked --group dev --no-editable

      - name: Run pre-commit checks
        run: uv run --no-sync pre-commit run --all-files

  python-validation:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync Python dependencies
        run: uv sync --locked --group dev --no-editable

      - name: Run Python tests
        run: uv run --no-sync pytest python/tests
